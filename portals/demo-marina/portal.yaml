apiVersion: portalc/v1
name: demo-marina
title: Demo Marina Partner Portal
baseUrl: http://127.0.0.1:8787
auth:
  mode: form
  loginPath: /login
  secrets:
    username: DEMO_MARINA_USER
    password: DEMO_MARINA_PASS
